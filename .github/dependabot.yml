# Weekly dependency PRs. Each one runs the full CI (tests + eval gate + security), so an upgrade that
# changes model behaviour or adds a CVE is caught before merge.
version: 2
updates:
  - { package-ecosystem: uv, directory: /, schedule: { interval: weekly } }
  - { package-ecosystem: github-actions, directory: /, schedule: { interval: weekly } }
  - { package-ecosystem: docker, directory: /, schedule: { interval: weekly } }
