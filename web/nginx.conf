# Serves the built React app and forwards /api to the API service (same origin: no CORS, no cross-site trust).
#
# LEARNING NOTES
# - `try_files ... /index.html`: the app does its own routing (/portal/requests/3), so any unknown path returns
#   index.html and React Router takes over. Without it, refreshing a deep link gives nginx's 404.
# - `proxy_buffering off` on /api: streamed copilot answers (Server-Sent Events) must reach the browser as they
#   are produced. With buffering, nginx would hold the whole answer and the "typing" effect (and TTFT) is gone.
# - Security headers: a strict Content-Security-Policy allows scripts only from this origin, so even an injected
#   <script> tag can't load code from elsewhere or exfiltrate the session token.
# - GOTCHA (found by deploy/k8s-local/smoke.sh): a location with ANY add_header of its own silently drops every
#   add_header inherited from `server`. Setting Cache-Control below had removed the CSP from every page. So the
#   security headers live in one snippet that each location includes, and the smoke test checks they're sent.
server {
    listen 8080;
    server_tokens off;
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    location /api/ {
        proxy_pass http://agentops-api.agentops.svc.cluster.local/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed asset names change on every build, so they can be cached forever; index.html must never be.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
