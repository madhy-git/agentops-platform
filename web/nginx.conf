# Serves the built React app and forwards /api to the API service (same origin: no CORS, no cross-site trust).
#
# LEARNING NOTES
# - `try_files ... /index.html`: the app does its own routing (/portal/requests/3), so any unknown path returns
#   index.html and React Router takes over. Without it, refreshing a deep link gives nginx's 404.
# - `proxy_buffering off` on /api: streamed copilot answers (Server-Sent Events) must reach the browser as they
#   are produced. With buffering, nginx would hold the whole answer and the "typing" effect (and TTFT) is gone.
# - Security headers: a strict Content-Security-Policy allows scripts only from this origin, so even an injected
#   <script> tag can't load code from elsewhere or exfiltrate the session token.
# - GOTCHA (found by deploy/k8s-local/smoke.sh): a location with ANY add_header of its own silently drops every
#   add_header inherited from `server`. Setting Cache-Control below had removed the CSP from every page. So the
#   security headers live in one snippet that each location includes, and the smoke test checks they're sent.
server {
    listen 8080;
    server_tokens off;
    # Redirects must be relative: nginx would otherwise build them from ITS port (8080), which only exists inside
    # the pod. Found when /api/docs redirected the browser to http://127.0.0.1:8080/api-docs/ (a dead address).
    absolute_redirect off;
    root /usr/share/nginx/html;
    include /etc/nginx/snippets/security-headers.conf;

    location = /healthz { access_log off; return 200 "ok\n"; }

    # FastAPI's interactive docs (/api/docs) load their schema from the root path /openapi.json; route that one
    # file to the API too, or the docs page gets index.html back and renders nothing.
    # FastAPI's own /docs page needs a CDN and an inline script, which the CSP blocks (it rendered blank):
    # send people to the self-hosted copy instead (web/public/api-docs/).
    location = /api/docs { return 302 /api-docs/; }
    location /api-docs/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri/index.html =404;
    }

    location = /openapi.json {
        proxy_pass http://agentops-api.agentops.svc.cluster.local/openapi.json;
    }

    location /api/ {
        proxy_pass http://agentops-api.agentops.svc.cluster.local/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed asset names change on every build, so they can be cached forever; index.html must never be.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
