[project]
name = "agentops-platform"
version = "0.1.0"
description = "Production-style AI agent service: model routing, guardrails, HITL approvals, evals and tracing"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.29", "pydantic-ai-slim>=1.0", "opentelemetry-sdk>=1.25"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
otlp = ["opentelemetry-exporter-otlp-proto-http>=1.25"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
