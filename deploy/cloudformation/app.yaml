AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  AgentOps compute: ECR repository and an EKS cluster with a managed node group in private subnets,
  the Pod Identity agent add-on, and an access entry for the deploying role.
# LEARNING NOTES
# - The API endpoint is private+public here so a laptop can run kubectl in a demo. Production: private
#   only, reached through a bastion/VPN, or set PublicAccessCidrs to your office range.
# - ECR: scan on push + immutable tags, so `:v0.4.0` can never be overwritten with different code.
# - Check the EKS versions AWS currently supports before deploying; KubernetesVersion is a parameter.

Parameters:
  Env: { Type: String, Default: demo }
  PrivateSubnets: { Type: List<AWS::EC2::Subnet::Id> }
  KubernetesVersion: { Type: String, Default: "1.33" }
  NodeInstanceType: { Type: String, Default: t3.large }
  DeployerRoleArn: { Type: String, Description: IAM role (e.g. GitHub OIDC role) granted cluster admin }
  PublicAccessCidrs: { Type: CommaDelimitedList, Default: "0.0.0.0/0" }

Resources:
  Repo:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Sub agentops-${Env}
      ImageTagMutability: IMMUTABLE
      ImageScanningConfiguration: { ScanOnPush: true }
      EncryptionConfiguration: { EncryptionType: KMS }
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"keep last 20","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}'

  ClusterRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: eks.amazonaws.com }, Action: sts:AssumeRole }]
      ManagedPolicyArns: [!Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSClusterPolicy"]
  SecretsKey:
    Type: AWS::KMS::Key
    Properties:
      Description: !Sub agentops-${Env} EKS secrets envelope encryption
      EnableKeyRotation: true
      KeyPolicy:
        Version: "2012-10-17"
        Statement:
          - { Sid: RootAdmin, Effect: Allow, Principal: { AWS: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:root" }, Action: "kms:*", Resource: "*" }
  Cluster:
    Type: AWS::EKS::Cluster
    Properties:
      Name: !Sub agentops-${Env}
      Version: !Ref KubernetesVersion
      RoleArn: !GetAtt ClusterRole.Arn
      AccessConfig: { AuthenticationMode: API }   # access entries, not the legacy aws-auth ConfigMap
      EncryptionConfig: [{ Provider: { KeyArn: !GetAtt SecretsKey.Arn }, Resources: [secrets] }]
      Logging:
        ClusterLogging:
          EnabledTypes: [{ Type: api }, { Type: audit }, { Type: authenticator }]
      ResourcesVpcConfig:
        SubnetIds: !Ref PrivateSubnets
        EndpointPrivateAccess: true
        EndpointPublicAccess: true
        PublicAccessCidrs: !Ref PublicAccessCidrs

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement: [{ Effect: Allow, Principal: { Service: ec2.amazonaws.com }, Action: sts:AssumeRole }]
      # Nodes get only what nodes need. Workload permissions come from Pod Identity roles (identity.yaml),
      # so a compromised pod can't use the node's role to reach Bedrock or the DB secret.
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKSWorkerNodePolicy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEKS_CNI_Policy"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly"
  Nodes:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !Ref Cluster
      NodeRole: !GetAtt NodeRole.Arn
      Subnets: !Ref PrivateSubnets
      InstanceTypes: [!Ref NodeInstanceType]
      ScalingConfig: { MinSize: 1, DesiredSize: 2, MaxSize: 3 }
      AmiType: AL2023_x86_64_STANDARD

  PodIdentityAgent:
    Type: AWS::EKS::Addon
    Properties: { ClusterName: !Ref Cluster, AddonName: eks-pod-identity-agent }

  DeployerAccess:
    Type: AWS::EKS::AccessEntry
    Properties:
      ClusterName: !Ref Cluster
      PrincipalArn: !Ref DeployerRoleArn
      AccessPolicies:
        - PolicyArn: !Sub "arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSClusterAdminPolicy"
          AccessScope: { Type: cluster }

Outputs:
  ClusterName: { Value: !Ref Cluster }
  ClusterSecurityGroupId: { Value: !GetAtt Cluster.ClusterSecurityGroupId }
  RepositoryUri: { Value: !GetAtt Repo.RepositoryUri }
