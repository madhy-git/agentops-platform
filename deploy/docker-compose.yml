# Local stack for AgentOps Platform.
#
# LEARNING NOTE: one Postgres holds *everything* (state, audit, flags, vectors, sessions).
# That is a deliberate "one choice per layer" decision (docs/adr/0002). Fewer moving parts
# means more time on AI-engineering problems instead of infrastructure plumbing.
#
# Services are grouped with *profiles* so the default `docker compose up` stays light:
#   docker compose -f deploy/docker-compose.yml up -d                       # postgres only (enough for tests)
#   docker compose -f deploy/docker-compose.yml --profile live up -d        # + LiteLLM gateway (needs provider keys)
#   docker compose -f deploy/docker-compose.yml --profile auth up -d        # + Keycloak (Phase 4)
#   docker compose -f deploy/docker-compose.yml --profile tracing up -d     # + Jaeger (traces UI)
#   docker compose -f deploy/docker-compose.yml --profile temporal up -d    # + Temporal dev server (Phase 5)

name: agentops

services:
  postgres:
    # pgvector image = stock Postgres + the `vector` extension, so Phase 2 RAG needs no new service.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: agentops
      POSTGRES_PASSWORD: agentops   # local-only, synthetic data. Never reuse outside dev.
      POSTGRES_DB: agentops
    ports: ["5433:5432"]   # 5433 on the host: avoids clashing with a locally installed Postgres on 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentops"]
      interval: 2s
      retries: 30
    volumes: [pgdata:/var/lib/postgresql/data]

  litellm:
    # LiteLLM is a gateway: the app speaks one OpenAI-compatible API, LiteLLM maps
    # tier aliases (agentops-tier1/2/3) to real providers. Swapping Bedrock for Anthropic or
    # Azure is a config change in deploy/litellm/config.yaml, not a code change (docs/adr/0003).
    profiles: [live]
    image: ghcr.io/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    volumes: ["./litellm/config.yaml:/app/config.yaml:ro"]
    env_file: [{ path: ../.env, required: false }]   # provider keys live in .env (git-ignored)
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-sk-local-dev}
    ports: ["4000:4000"]

  keycloak:
    # Phase 4: identity provider. Users log in; the API trusts JWT claims for roles.
    profiles: [auth]
    image: quay.io/keycloak/keycloak:26.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    volumes: ["./keycloak:/opt/keycloak/data/import:ro"]
    ports: ["8080:8080"]

  jaeger:
    # Receives OpenTelemetry traces over OTLP (4318) and shows them in a UI (16686).
    profiles: [tracing]
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686", "4318:4318"]

  temporal:
    # Phase 5: durable workflows. The dev server keeps state in SQLite inside the container.
    profiles: [temporal]
    image: temporalio/temporal:1.9.1   # Temporal CLI image; `start-dev` runs a single-node dev server
    entrypoint: ["temporal", "server", "start-dev", "--ip", "0.0.0.0"]
    ports: ["7233:7233", "8233:8233"]

volumes:
  pgdata:
