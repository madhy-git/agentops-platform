# Observability for the local cluster: OpenTelemetry Collector -> Jaeger (traces) + Prometheus (metrics) -> Grafana.
#
#   app pods --OTLP--> otel-collector --traces--> jaeger      (UI: http://localhost:16686 via forward.sh)
#                                     --metrics-> prometheus <--- grafana (UI: http://localhost:3000 via forward.sh)
#
# LEARNING NOTES
# - The collector is the one place that knows where telemetry goes. Apps speak OTLP to it; swapping Jaeger for
#   Tempo, or Prometheus for CloudWatch, is a collector config change. That's what ADOT does in the EKS base.
# - Prometheus PULLS: it scrapes the collector's /metrics every 15 s. Apps PUSH OTLP to the collector. The
#   collector bridges the two models, so app pods never need a /metrics endpoint of their own.
# - All of this is in-memory / emptyDir: restart a pod and its history is gone. Fine for learning; production
#   needs persistent storage and retention limits (and probably a managed service).
# - Same hardening as the app: non-root, no capabilities, restricted Pod Security, default-deny ingress with
#   explicit allows below. No UI is published to the network; forward.sh opens them on 127.0.0.1 only.
apiVersion: v1
kind: ConfigMap
metadata: { name: otel-collector-config, namespace: agentops }
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http: { endpoint: 0.0.0.0:4318 }
          grpc: { endpoint: 0.0.0.0:4317 }
    processors:
      memory_limiter: { check_interval: 1s, limit_mib: 200 }   # shed load instead of being OOM-killed
      batch: {}
    exporters:
      otlp/jaeger:
        endpoint: jaeger.agentops.svc.cluster.local:4317
        tls: { insecure: true }   # in-cluster only
      prometheus:
        endpoint: 0.0.0.0:8889
        resource_to_telemetry_conversion: { enabled: true }   # service.name becomes a label (api vs worker)
    extensions:
      health_check: { endpoint: 0.0.0.0:13133 }
    service:
      extensions: [health_check]
      pipelines:
        traces: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [otlp/jaeger] }
        metrics: { receivers: [otlp], processors: [memory_limiter, batch], exporters: [prometheus] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: otel-collector, namespace: agentops, labels: { app: otel-collector } }
spec:
  replicas: 1
  selector: { matchLabels: { app: otel-collector } }
  template:
    metadata: { labels: { app: otel-collector } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: collector
          image: otel/opentelemetry-collector-contrib:0.111.0
          args: ["--config=/etc/otel/config.yaml"]
          ports: [{ containerPort: 4318 }, { containerPort: 4317 }, { containerPort: 8889 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 256Mi } }
          readinessProbe: { httpGet: { path: /, port: 13133 }, periodSeconds: 10 }
          volumeMounts: [{ name: config, mountPath: /etc/otel }]
      volumes: [{ name: config, configMap: { name: otel-collector-config } }]
---
apiVersion: v1
kind: Service
metadata: { name: otel-collector, namespace: agentops }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: metrics, port: 8889, targetPort: 8889 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: jaeger, namespace: agentops, labels: { app: jaeger } }
spec:
  replicas: 1
  selector: { matchLabels: { app: jaeger } }
  template:
    metadata: { labels: { app: jaeger } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.62.0   # same version as docker-compose's `tracing` profile
          env:
            - { name: MEMORY_MAX_TRACES, value: "20000" }   # in-memory store: cap it, or it grows until OOM
          ports: [{ containerPort: 16686 }, { containerPort: 4317 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          readinessProbe: { httpGet: { path: /, port: 16686 }, periodSeconds: 10 }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes: [{ name: tmp, emptyDir: {} }]
---
apiVersion: v1
kind: Service
metadata: { name: jaeger, namespace: agentops }
spec:
  selector: { app: jaeger }
  ports:
    - { name: ui, port: 16686, targetPort: 16686 }
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
---
apiVersion: v1
kind: ConfigMap
metadata: { name: prometheus-config, namespace: agentops }
data:
  prometheus.yml: |
    global: { scrape_interval: 15s }
    scrape_configs:
      - job_name: otel-collector
        static_configs: [{ targets: ["otel-collector.agentops.svc.cluster.local:8889"] }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: prometheus, namespace: agentops, labels: { app: prometheus } }
spec:
  replicas: 1
  selector: { matchLabels: { app: prometheus } }
  template:
    metadata: { labels: { app: prometheus } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65534, fsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.55.0
          args: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.path=/prometheus",
                 "--storage.tsdb.retention.time=2d"]
          ports: [{ containerPort: 9090 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          readinessProbe: { httpGet: { path: /-/ready, port: 9090 }, periodSeconds: 10 }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus }
            - { name: data, mountPath: /prometheus }
      volumes:
        - { name: config, configMap: { name: prometheus-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata: { name: prometheus, namespace: agentops }
spec:
  selector: { app: prometheus }
  ports: [{ port: 9090, targetPort: 9090 }]
---
# Grafana: datasources and the dashboard are provisioned from ConfigMaps (dashboards as code: reviewed in git,
# identical on every rebuild). Anonymous users get read-only Viewer; the admin password is random (up.sh).
apiVersion: v1
kind: ConfigMap
metadata: { name: grafana-provisioning, namespace: agentops }
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - { name: Prometheus, uid: prometheus, type: prometheus, access: proxy, isDefault: true,
          url: "http://prometheus.agentops.svc.cluster.local:9090" }
      - { name: Jaeger, uid: jaeger, type: jaeger, access: proxy,
          url: "http://jaeger.agentops.svc.cluster.local:16686" }
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - { name: agentops, folder: AgentOps, type: file, allowUiUpdates: false,
          options: { path: /var/lib/grafana/dashboards } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: agentops, labels: { app: grafana } }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 472, fsGroup: 472, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: grafana
          image: grafana/grafana:11.3.0
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "true" }
            - { name: GF_AUTH_ANONYMOUS_ORG_ROLE, value: Viewer }
            - { name: GF_SECURITY_ADMIN_PASSWORD, valueFrom: { secretKeyRef: { name: grafana-admin, key: password } } }
            - { name: GF_ANALYTICS_REPORTING_ENABLED, value: "false" }
            - { name: GF_ANALYTICS_CHECK_FOR_UPDATES, value: "false" }
            - { name: GF_PATHS_DATA, value: /var/lib/grafana/data }
            - { name: GF_PATHS_LOGS, value: /var/lib/grafana/logs }
            - { name: GF_PATHS_PLUGINS, value: /var/lib/grafana/plugins }
            - { name: GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH, value: /var/lib/grafana/dashboards/agentops.json }
          ports: [{ containerPort: 3000 }]
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: { requests: { cpu: 50m, memory: 128Mi }, limits: { memory: 512Mi } }
          readinessProbe: { httpGet: { path: /api/health, port: 3000 }, periodSeconds: 10 }
          volumeMounts:
            - { name: data, mountPath: /var/lib/grafana }
            - { name: tmp, mountPath: /tmp }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/datasources/datasources.yaml, subPath: datasources.yaml }
            - { name: provisioning, mountPath: /etc/grafana/provisioning/dashboards/dashboards.yaml, subPath: dashboards.yaml }
            - { name: dashboards, mountPath: /var/lib/grafana/dashboards }
      volumes:
        - { name: data, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: provisioning, configMap: { name: grafana-provisioning } }
        - { name: dashboards, configMap: { name: grafana-dashboards } }
---
apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: agentops }
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
---
# Default-deny is on for the namespace (base 50-network-policy.yaml). Allow exactly the flows drawn above.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: collector-from-app, namespace: agentops }
spec:
  podSelector: { matchLabels: { app: otel-collector } }
  ingress:
    - from: [{ podSelector: { matchLabels: { app: agentops-api } } }, { podSelector: { matchLabels: { app: agentops-worker } } }]
      ports: [{ port: 4318 }, { port: 4317 }]
    - from: [{ podSelector: { matchLabels: { app: prometheus } } }]
      ports: [{ port: 8889 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: jaeger-ingress, namespace: agentops }
spec:
  podSelector: { matchLabels: { app: jaeger } }
  ingress:
    - from: [{ podSelector: { matchLabels: { app: otel-collector } } }]
      ports: [{ port: 4317 }]
    - from: [{ podSelector: { matchLabels: { app: grafana } } }]
      ports: [{ port: 16686 }]
    - ports: [{ port: 16686 }]   # the UI, reached via port-forward from this Mac
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: prometheus-from-grafana, namespace: agentops }
spec:
  podSelector: { matchLabels: { app: prometheus } }
  ingress: [{ from: [{ podSelector: { matchLabels: { app: grafana } } }], ports: [{ port: 9090 }] }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: grafana-ui, namespace: agentops }
spec:
  podSelector: { matchLabels: { app: grafana } }
  ingress: [{ ports: [{ port: 3000 }] }]
